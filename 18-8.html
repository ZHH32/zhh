<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书销售数据大屏 · ECharts</title>
    <script src="cdn/echarts.min.js"></script>
    <script src="cdn/china-map.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0e27;
            color: #c0c8e0;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== 顶部标题栏 ===== */
        .zhh_topbar {
            height: 56px;
            background: linear-gradient(90deg, rgba(10,14,39,.9), rgba(20,30,60,.9), rgba(10,14,39,.9));
            border-bottom: 1px solid rgba(0, 212, 255, .2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .zhh_topbar h1 {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #00ff9d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        .zhh_clock { font-family: Consolas, monospace; font-size: 16px; color: #00d4ff; }
        .zhh_update { font-size: 12px; color: #6b7c93; }

        /* ===== 三列布局 ===== */
        .zhh_dashboard {
            display: grid;
            grid-template-columns: 1fr 1.8fr 1fr;
            gap: 10px;
            padding: 10px;
            height: calc(100vh - 56px);
        }
        .zhh_col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

        /* ===== 面板 ===== */
        .zhh_panel {
            background: rgba(16, 24, 48, .85);
            border: 1px solid rgba(0, 212, 255, .15);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .zhh_panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            background: linear-gradient(180deg, #00d4ff, transparent);
        }
        .zhh_panel.flex2 { flex: 2; }
        .zhh_panel.flex1 { flex: 1; }
        .zhh_panel.flex3 { flex: 3; }

        .zhh_panel_title {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            color: #00d4ff;
            border-bottom: 1px solid rgba(0, 212, 255, .1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zhh_panel_title::before {
            content: "";
            width: 4px; height: 14px;
            background: #00d4ff;
            border-radius: 2px;
        }
        .zhh_panel_body { flex: 1; min-height: 0; }
        .zhh_chart { width: 100%; height: 100%; }

        /* 角标装饰 */
        .zhh_corner {
            position: absolute;
            width: 10px; height: 10px;
            border: 1px solid rgba(0, 212, 255, .4);
        }
        .zhh_corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
        .zhh_corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
        .zhh_corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
        .zhh_corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }

        @media (max-width: 900px) {
            .zhh_dashboard { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            body { overflow: auto; height: auto; }
            .zhh_panel { min-height: 260px; }
        }
    </style>
</head>
<body>
    <!-- 姓名：张淮皓，建立时间：2026-11-05，使用的大模型：GLM-5.3-Flash，功能名称：ECharts 图书销售数据大屏（三列布局含中国地图） -->
    <!-- 顶部标题栏 -->
    <div class="zhh_topbar">
        <h1>图书销售数据大屏</h1>
        <div class="zhh_clock" id="zhh_clock">--:--:--</div>
        <div class="zhh_update">数据更新于 2026-11-05 · 张淮皓</div>
    </div>

    <!-- 三列大屏 -->
    <div class="zhh_dashboard">
        <!-- ===== 左列 ===== -->
        <div class="zhh_col">
            <div class="zhh_panel flex1">
                <span class="zhh_corner tl"></span><span class="zhh_corner tr"></span>
                <span class="zhh_corner bl"></span><span class="zhh_corner br"></span>
                <div class="zhh_panel_title">各品类月度销量</div>
                <div class="zhh_panel_body"><div class="zhh_chart" id="zhh_bar"></div></div>
            </div>
            <div class="zhh_panel flex1">
                <span class="zhh_corner tl"></span><span class="zhh_corner tr"></span>
                <span class="zhh_corner bl"></span><span class="zhh_corner br"></span>
                <div class="zhh_panel_title">用户渠道占比</div>
                <div class="zhh_panel_body"><div class="zhh_chart" id="zhh_pie"></div></div>
            </div>
        </div>

        <!-- ===== 中列 ===== -->
        <div class="zhh_col">
            <div class="zhh_panel flex3">
                <span class="zhh_corner tl"></span><span class="zhh_corner tr"></span>
                <span class="zhh_corner bl"></span><span class="zhh_corner br"></span>
                <div class="zhh_panel_title">全国销售分布地图</div>
                <div class="zhh_panel_body"><div class="zhh_chart" id="zhh_map"></div></div>
            </div>
            <div class="zhh_panel flex1">
                <span class="zhh_corner tl"></span><span class="zhh_corner tr"></span>
                <span class="zhh_corner bl"></span><span class="zhh_corner br"></span>
                <div class="zhh_panel_title">近 7 日销售趋势</div>
                <div class="zhh_panel_body"><div class="zhh_chart" id="zhh_trend"></div></div>
            </div>
        </div>

        <!-- ===== 右列 ===== -->
        <div class="zhh_col">
            <div class="zhh_panel flex1">
                <span class="zhh_corner tl"></span><span class="zhh_corner tr"></span>
                <span class="zhh_corner bl"></span><span class="zhh_corner br"></span>
                <div class="zhh_panel_title">客户满意度</div>
                <div class="zhh_panel_body"><div class="zhh_chart" id="zhh_gauge"></div></div>
            </div>
            <div class="zhh_panel flex1">
                <span class="zhh_corner tl"></span><span class="zhh_corner tr"></span>
                <span class="zhh_corner bl"></span><span class="zhh_corner br"></span>
                <div class="zhh_panel_title">热门图书 TOP 8</div>
                <div class="zhh_panel_body"><div class="zhh_chart" id="zhh_rank"></div></div>
            </div>
        </div>
    </div>

    <script>
        /* 注册中国地图 */
        echarts.registerMap('china', window.chinaGeoJson);

        /* 深色主题通用样式 */
        var zhh_colors = ['#00d4ff', '#00ff9d', '#ffaa00', '#ff6b9d', '#8b5cf6', '#36cfc9', '#ff7875'];
        var zhh_charts = [];

        function zhh_init(id, option) {
            var c = echarts.init(document.getElementById(id));
            c.setOption(option);
            zhh_charts.push(c);
            return c;
        }

        /* ===== 1. 柱状图：各品类月度销量 ===== */
        zhh_init('zhh_bar', {
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '5%', right: '5%', bottom: '8%', top: '12%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['文学', '科技', '教育', '历史', '艺术', '少儿', '经管'],
                axisLine: { lineStyle: { color: '#3a4a6a' } },
                axisLabel: { color: '#8a9ab0', fontSize: 11 }
            },
            yAxis: {
                type: 'value',
                axisLine: { show: false },
                axisLabel: { color: '#6b7c93', fontSize: 10 },
                splitLine: { lineStyle: { color: 'rgba(58,74,106,.3)' } }
            },
            series: [{
                type: 'bar',
                data: [3200, 5800, 4500, 2100, 1800, 3900, 2600],
                barWidth: '45%',
                itemStyle: {
                    color: {
                        type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                        colorStops: [
                            { offset: 0, color: '#00d4ff' },
                            { offset: 1, color: 'rgba(0,212,255,.2)' }
                        ]
                    },
                    borderRadius: [4, 4, 0, 0]
                }
            }]
        });

        /* ===== 2. 饼图：用户渠道占比 ===== */
        zhh_init('zhh_pie', {
            tooltip: { trigger: 'item' },
            legend: {
                bottom: '2%', left: 'center',
                textStyle: { color: '#8a9ab0', fontSize: 11 },
                itemWidth: 10, itemHeight: 10
            },
            series: [{
                type: 'pie',
                radius: ['35%', '60%'],
                center: ['50%', '42%'],
                data: [
                    { value: 4280, name: 'Web 端' },
                    { value: 3520, name: 'APP' },
                    { value: 2180, name: '小程序' },
                    { value: 1020, name: '企业微信' }
                ],
                itemStyle: { borderColor: '#0a0e27', borderWidth: 2 },
                label: { color: '#c0c8e0', fontSize: 11 },
                color: zhh_colors
            }]
        });

        /* ===== 3. 中国地图：全国销售分布 ===== */
        var zhh_cities = [
            { name: '北京', value: [116.46, 39.92, 9800] },
            { name: '上海', value: [121.48, 31.22, 12500] },
            { name: '广州', value: [113.23, 23.16, 8600] },
            { name: '深圳', value: [114.07, 22.62, 9200] },
            { name: '成都', value: [104.06, 30.67, 5400] },
            { name: '武汉', value: [114.31, 30.52, 4800] },
            { name: '杭州', value: [120.19, 30.26, 7200] },
            { name: '西安', value: [108.95, 34.27, 3600] },
            { name: '南京', value: [118.78, 32.04, 5800] },
            { name: '重庆', value: [106.54, 29.59, 6200] },
            { name: '长沙', value: [112.97, 28.21, 4200] },
            { name: '沈阳', value: [123.43, 41.80, 3800] },
            { name: '郑州', value: [113.65, 34.76, 3900] },
            { name: '青岛', value: [120.38, 36.07, 4600] }
        ];

        zhh_init('zhh_map', {
            tooltip: {
                trigger: 'item',
                formatter: function (p) {
                    if (p.seriesType === 'effectScatter') {
                        return p.name + '<br/>销售额：¥' + (p.value[2] * 1000).toLocaleString();
                    }
                    return p.name;
                }
            },
            geo: {
                map: 'china',
                roam: true,
                zoom: 1.2,
                itemStyle: {
                    areaColor: '#0d1b3a',
                    borderColor: '#1a3a6a',
                    borderWidth: 1
                },
                emphasis: {
                    itemStyle: { areaColor: '#1a4a7a' },
                    label: { color: '#00d4ff', fontSize: 11 }
                },
                label: { show: false }
            },
            series: [{
                name: '销售分布',
                type: 'effectScatter',
                coordinateSystem: 'geo',
                data: zhh_cities,
                symbolSize: function (val) {
                    return Math.max(6, val[2] / 300);
                },
                rippleEffect: { brushType: 'stroke', scale: 4, period: 4 },
                itemStyle: {
                    color: '#00d4ff',
                    shadowBlur: 10,
                    shadowColor: '#00d4ff'
                },
                label: {
                    show: true,
                    formatter: '{b}',
                    position: 'right',
                    color: '#c0c8e0',
                    fontSize: 10
                }
            }]
        });

        /* ===== 4. 折线图：近 7 日趋势 ===== */
        zhh_init('zhh_trend', {
            tooltip: { trigger: 'axis' },
            legend: {
                data: ['销售额', '订单量'],
                textStyle: { color: '#8a9ab0', fontSize: 11 },
                right: '5%', top: '3%'
            },
            grid: { left: '5%', right: '5%', bottom: '8%', top: '18%', containLabel: true },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['11-01', '11-02', '11-03', '11-04', '11-05', '11-06', '11-07'],
                axisLine: { lineStyle: { color: '#3a4a6a' } },
                axisLabel: { color: '#8a9ab0', fontSize: 11 }
            },
            yAxis: [
                { type: 'value', name: '销售额', axisLine: { show: false },
                  axisLabel: { color: '#6b7c93', fontSize: 10 },
                  splitLine: { lineStyle: { color: 'rgba(58,74,106,.3)' } } },
                { type: 'value', name: '订单量', axisLine: { show: false },
                  axisLabel: { color: '#6b7c93', fontSize: 10 },
                  splitLine: { show: false } }
            ],
            series: [
                {
                    name: '销售额', type: 'line', smooth: true,
                    data: [8200, 9300, 8800, 10200, 11500, 9800, 12600],
                    itemStyle: { color: '#00d4ff' },
                    lineStyle: { width: 3 },
                    areaStyle: {
                        color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [{ offset: 0, color: 'rgba(0,212,255,.3)' }, { offset: 1, color: 'rgba(0,212,255,.02)' }] }
                    }
                },
                {
                    name: '订单量', type: 'line', smooth: true, yAxisIndex: 1,
                    data: [320, 380, 360, 420, 480, 410, 520],
                    itemStyle: { color: '#00ff9d' },
                    lineStyle: { width: 3 }
                }
            ]
        });

        /* ===== 5. 仪表盘：客户满意度 ===== */
        zhh_init('zhh_gauge', {
            series: [{
                type: 'gauge',
                center: ['50%', '60%'],
                radius: '85%',
                min: 0, max: 100,
                splitNumber: 5,
                axisLine: {
                    lineStyle: {
                        width: 12,
                        color: [
                            [0.6, '#ff7875'], [0.8, '#ffaa00'], [1, '#00ff9d']
                        ]
                    }
                },
                pointer: { width: 4, length: '65%', itemStyle: { color: '#00d4ff' } },
                axisTick: { distance: -12, length: 5, lineStyle: { color: '#3a4a6a' } },
                splitLine: { distance: -12, length: 10, lineStyle: { color: '#3a4a6a' } },
                axisLabel: { color: '#6b7c93', fontSize: 9, distance: -22 },
                detail: {
                    valueAnimation: true,
                    formatter: '{value}%',
                    color: '#00ff9d',
                    fontSize: 22,
                    offsetCenter: [0, '30%']
                },
                data: [{ value: 92 }]
            }]
        });

        /* ===== 6. 横向柱状图：热门图书 TOP 8 ===== */
        var zhh_books = ['三体', '活着', '百年孤独', '人类简史', '解忧杂货店', '追风筝的人', '小王子', '围城'];
        var zhh_sales = [8600, 7200, 6800, 6200, 5800, 5400, 4800, 4200];
        zhh_init('zhh_rank', {
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '5%', right: '12%', bottom: '5%', top: '8%', containLabel: true },
            xAxis: { type: 'value', axisLine: { show: false },
                     axisLabel: { color: '#6b7c93', fontSize: 10 },
                     splitLine: { lineStyle: { color: 'rgba(58,74,106,.2)' } } },
            yAxis: {
                type: 'category',
                data: zhh_books.reverse(),
                axisLine: { lineStyle: { color: '#3a4a6a' } },
                axisLabel: { color: '#c0c8e0', fontSize: 11 }
            },
            series: [{
                type: 'bar',
                data: zhh_sales.reverse(),
                barWidth: '50%',
                label: { show: true, position: 'right', color: '#00d4ff', fontSize: 10 },
                itemStyle: {
                    color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0,
                        colorStops: [{ offset: 0, color: 'rgba(0,212,255,.2)' }, { offset: 1, color: '#00d4ff' }] },
                    borderRadius: [0, 4, 4, 0]
                }
            }]
        });

        /* ===== 实时时钟 ===== */
        function zhh_tickClock() {
            var d = new Date();
            var h = String(d.getHours()).padStart(2, '0');
            var m = String(d.getMinutes()).padStart(2, '0');
            var s = String(d.getSeconds()).padStart(2, '0');
            document.getElementById('zhh_clock').textContent = h + ':' + m + ':' + s;
        }
        setInterval(zhh_tickClock, 1000);
        zhh_tickClock();

        /* ===== 窗口缩放自适应 ===== */
        window.addEventListener('resize', function () {
            for (var i = 0; i < zhh_charts.length; i++) {
                zhh_charts[i].resize();
            }
        });
    </script>
</body>
</html>
