<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation 幻灯片</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111827;
      color: #fff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .slider {
      width: min(90vw, 760px);
      overflow: hidden;
      border-radius: 18px;
      background: #1f2937;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .slides {
      position: relative;
      height: 480px;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: slideChange 12s infinite;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide:nth-child(1) {
      animation-delay: 0s;
    }

    .slide:nth-child(2) {
      animation-delay: 4s;
    }

    .slide:nth-child(3) {
      animation-delay: 8s;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.7));
    }

    .slide-title {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 30px;
      z-index: 1;
      padding: 12px 18px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .caption {
      padding: 24px 28px;
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      line-height: 1.8;
      color: #d1d5db;
    }

    @keyframes slideChange {
      0%, 25% {
        opacity: 1;
        transform: translateX(0);
        z-index: 1;
      }

      33%, 66% {
        opacity: 1;
        transform: translateX(-12%);
        z-index: 1;
      }

      75%, 100% {
        opacity: 0;
        transform: translateX(-30%);
        z-index: 0;
      }
    }

    @media (max-width: 600px) {
      .slides {
        height: 380px;
      }

      .caption {
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="slider" aria-label="图片幻灯片">
    <div class="slides">
      <figure class="slide">
        <img src="img/1.png" alt="图片一">
        <figcaption class="slide-title">张淮皓</figcaption>
      </figure>
      <figure class="slide">
        <img src="img/2.png" alt="图片二">
        <figcaption class="slide-title">张淮皓</figcaption>
      </figure>
      <figure class="slide">
        <img src="img/3.png" alt="图片三">
        <figcaption class="slide-title">张淮皓</figcaption>
      </figure>
    </div>
    <div class="caption">欢迎来到我的幻灯片展示</div>
  </div>
</body>
</html>
