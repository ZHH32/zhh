<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张淮皓 flex</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            padding: 30px;
        }
        /* 外层：4个卡片横向排列 */
        .wrap{
            display: flex;
            gap: 20px;
        }
        /* 每个大卡片外框，正方形盒子 */
        .card{
            width: 24%;
            aspect-ratio: 1 / 1;
            border:1px solid #999;
            background: #f8f9fa;
            padding: 15px;
        }
        /* 灰色块通用样式 */
        .item{
            background: #e2e3e5;
            border:1px solid #333;
        }

        /* 第1个：单个方块，flex居中 */
        .card1{
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .card1 .item{
            width: 40%;
            aspect-ratio:1/1;
        }

        /* 第2个：上下两个矩形，纵向flex */
        .card2{
            display:flex;
            flex-direction: column;
            justify-content:center;
            align-items:center;
            gap:10px;
        }
        .card2 .item{
            width:60%;
            height:35%;
        }

        /* 第3个：2行2列四格，flex换行 */
        .card3{
            display:flex;
            flex-wrap: wrap;
            gap:10px;
        }
        .card3 .item{
            width: calc(50% - 5px);
            height: calc(50% - 5px);
        }

        /* 第4个：上通栏，下方左右两格，纯flex实现 */
        .card4{
            display:flex;
            flex-direction: column;
            gap:10px;
        }
        .card4 .top-item{
            flex:1;
        }
        .card4 .bottom-row{
            display:flex;
            gap:10px;
            flex:1;
        }
        .card4 .bottom-row .item{
            flex:1;
        }
    </style>
</head>
<body>
    <h2>张淮皓 flex</h2>
    <div class="wrap">
        <!-- 第一个容器 1个方块 -->
        <div class="card card1">
            <div class="item"></div>
        </div>
        <!-- 第二个容器 上下2个 -->
        <div class="card card2">
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <!-- 第三个容器 2*2四格 -->
        <div class="card card3">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <!-- 第四个容器 上通栏，下2格（修复！） -->
        <div class="card card4">
            <div class="item top-item"></div>
            <div class="bottom-row">
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>
    </div>
</body>
</html>
