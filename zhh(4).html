<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易新闻下导航（自适应宽度）</title>
    <style>
        /* ========== 全局 CSS ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f5f7;
            min-height: 100vh;
        }

        /* ========== 模块 CSS（类名均含姓名缩写 zhh） ========== */
        /* 底部导航：固定在底部，最大宽度 640px，flex 平分宽度实现自适应 */
        .zhh_tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0 auto;
            max-width: 640px;
            height: 58px;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            align-items: stretch;
        }
        /* 普通页签：弹性平分宽度，SVG图标+文字纵向排列 */
        .zhh_tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            user-select: none;
            color: #333;
        }
        /* SVG图标：去掉原始填充色，统一由CSS的fill控制，选中/悬停变红 */
        .zhh_tab svg {
            width: 26px;
            height: 26px;
            fill: #333;
            transition: fill .2s;
        }
        .zhh_tabText { font-size: 12px; }
        .zhh_tab:hover { color: #f04142; }
        .zhh_tab:hover svg { fill: #f04142; }
        /* 选中态：红色，与截图一致 */
        .zhh_tab.zhh_on { color: #f04142; }
        .zhh_tab.zhh_on svg { fill: #f04142; }

        /* 未登录图标右上角的红点 */
        .zhh_dot {
            position: relative;
            display: flex;
        }
        .zhh_dot::after {
            content: "";
            position: absolute;
            right: -6px;
            top: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f04142;
        }

        /* 中间发布按钮：使用 iconfont 下载的红底加号 SVG（自带配色），悬停放大 */
        .zhh_tabPublish {
            flex: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zhh_publishBtn {
            cursor: pointer;
            transition: transform .2s;
        }
        .zhh_publishBtn:hover { transform: scale(1.06); }
        .zhh_publishBtn svg {
            width: 44px;
            height: 44px;
        }

        /* 自适应：窄视口时缩小图标 */
        @media (max-width: 380px) {
            .zhh_tab svg { width: 22px; height: 22px; }
            .zhh_tabText { font-size: 11px; }
            .zhh_publishBtn svg { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <!-- 姓名：张淮皓，建立时间：2026-11-05，使用的大模型：GLM-5.3-Flash，功能名称：网易新闻下导航（iconfont下载的SVG图标，自适应宽度） -->

    <script>
        // 点击页签切换红色选中态（发布按钮除外）
        function zhh_initTabbar() {
            var zhh_tabs = document.querySelector(".zhh_tabbar").children;
            for (var zhh_i = 0; zhh_i < zhh_tabs.length; zhh_i++) {
                if (zhh_tabs[zhh_i].className.indexOf("zhh_tabPublish") !== -1) { continue; }
                zhh_tabs[zhh_i].onclick = function () {
                    var zhh_list = document.querySelectorAll(".zhh_tab");
                    for (var zhh_j = 0; zhh_j < zhh_list.length; zhh_j++) {
                        zhh_list[zhh_j].classList.remove("zhh_on");
                    }
                    this.classList.add("zhh_on");
                };
            }
        }
        zhh_initTabbar();
    </script>
