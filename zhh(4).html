<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易新闻下导航（自适应宽度）</title>
    <style>
        /* ========== 全局 CSS ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f5f7;
            min-height: 100vh;
        }

        /* ========== 模块 CSS（类名均含姓名缩写 zhh） ========== */
        /* 底部导航：固定在底部，最大宽度 640px，flex 平分宽度实现自适应 */
        .zhh_tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0 auto;
            max-width: 640px;
            height: 58px;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            align-items: stretch;
        }
        /* 普通页签：弹性平分宽度，SVG图标+文字纵向排列 */
        .zhh_tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            user-select: none;
            color: #333;
        }
        /* SVG图标：去掉原始填充色，统一由CSS的fill控制，选中/悬停变红 */
        .zhh_tab svg {
            width: 26px;
            height: 26px;
            fill: #333;
            transition: fill .2s;
        }
        .zhh_tabText { font-size: 12px; }
        .zhh_tab:hover { color: #f04142; }
        .zhh_tab:hover svg { fill: #f04142; }
        /* 选中态：红色，与截图一致 */
        .zhh_tab.zhh_on { color: #f04142; }
        .zhh_tab.zhh_on svg { fill: #f04142; }

        /* 未登录图标右上角的红点 */
        .zhh_dot {
            position: relative;
            display: flex;
        }
        .zhh_dot::after {
            content: "";
            position: absolute;
            right: -6px;
            top: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f04142;
        }

        /* 中间发布按钮：使用 iconfont 下载的红底加号 SVG（自带配色），悬停放大 */
        .zhh_tabPublish {
            flex: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zhh_publishBtn {
            cursor: pointer;
            transition: transform .2s;
        }
        .zhh_publishBtn:hover { transform: scale(1.06); }
        .zhh_publishBtn svg {
            width: 44px;
            height: 44px;
        }

        /* 自适应：窄视口时缩小图标 */
        @media (max-width: 380px) {
            .zhh_tab svg { width: 22px; height: 22px; }
            .zhh_tabText { font-size: 11px; }
            .zhh_publishBtn svg { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <!-- 姓名：张淮皓，建立时间：2026-11-05，使用的大模型：GLM-5.3-Flash，功能名称：网易新闻下导航（iconfont下载的SVG图标，自适应宽度） -->
    <nav class="zhh_tabbar">
        <div class="zhh_tab zhh_on">
            <!-- 首页：文档表单图标（iconfont: form） -->
            <svg viewBox="0 0 1152 1024" xmlns="http://www.w3.org/2000/svg"><path d="M1145.152 6.848H6.848V1008h1138.304V6.848zM1104 48v918.848h-1056V48h1056z" /><path d="M797.216 705.6l0.096 41.152-603.104 1.344-0.064-41.12zM679.904 459.424v41.152H204.288v-41.152zM904.256 239.392l0.096 41.152-710.144 1.216-0.064-41.152z" /></svg>
            <span class="zhh_tabText">首页</span>
        </div>
        <div class="zhh_tab">
            <!-- 视频：播放三角图标（iconfont: zhihangchaxun） -->
            <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M192 32v960l662.4-480L192 32z m64 128l489.6 352L256 864V160z" /></svg>
            <span class="zhh_tabText">视频</span>
        </div>
        <div class="zhh_tabPublish">
            <!-- 发布：红底白色加号图标（iconfont: ic_add，保留原始红白配色） -->
            <div class="zhh_publishBtn" title="发布">
                <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path d="M85.333333 64m426.666667 0l0 0q426.666667 0 426.666667 426.666667l0 0q0 426.666667-426.666667 426.666666l0 0q-426.666667 0-426.666667-426.666666l0 0q0-426.666667 426.666667-426.666667Z" fill="#F72A27"/>
                    <path d="M533.333333 298.666667v192h192v42.666666h-192v192h-42.666666v-192h-192v-42.666666h192v-192h42.666666z" fill="#FFFFFF"/>
                </svg>
            </div>
        </div>
        <div class="zhh_tab">
            <!-- 社区：聊天气泡图标（iconfont: shequ） -->
            <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M778.6496 133.12H245.3504C172.05248 133.12 112.64 192.53248 112.64 265.8304v411.17696c0 73.29792 59.41248 132.7104 132.7104 132.7104h113.27488c12.94336 0 25.61024 3.7888 36.43392 10.89536l98.65216 64.8192a33.15712 33.15712 0 0 0 36.096 0.21504l102.3488-65.47456a66.3552 66.3552 0 0 1 35.75808-10.45504h112.01536C852.52096 809.71776 911.36 750.87872 911.36 678.28736V265.8304C911.36 192.53248 851.94752 133.12 778.6496 133.12z m76.3904 544.768l-0.01024 1.26976a76.9536 76.9536 0 0 1-76.94336 75.68384H647.44448a65.98656 65.98656 0 0 0-34.21184 9.97376L529.408 817.0496l-0.37888 0.23552a32.99328 32.99328 0 0 1-34.83648-0.45056l-80.64-51.59936-0.57344-0.3584a65.92512 65.92512 0 0 0-34.97984-10.0352H245.9136l-1.26976-0.01024A76.96384 76.96384 0 0 1 168.96 677.888V265.76896l0.01024-1.26976a76.9536 76.9536 0 0 1 76.94336-75.68384h532.1728a76.96384 76.96384 0 0 1 76.9536 76.9536V677.888z" /><path d="M698.28608 357.376a26.624 26.624 0 0 1 0.62464 53.23776l-0.62464 0.01024H327.68a26.624 26.624 0 0 1-0.62464-53.23776L327.68 357.376h370.60608z" /><path d="M454.656 589.1072H327.68c-14.6432 0-26.624-11.9808-26.624-26.624 0-14.6432 11.9808-26.624 26.624-26.624h126.976c14.6432 0 26.624 11.9808 26.624 26.624 0 14.6432-11.9808 26.624-26.624 26.624z" opacity=".5" /></svg>
            <span class="zhh_tabText">社区</span>
        </div>
        <div class="zhh_tab">
            <!-- 未登录：人形剪影图标（iconfont: huabanbeifenx），右上角红点 -->
            <span class="zhh_dot">
                <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M512 64c143.84 0 224 95.744 224 224v96c0 128-87.936 160-87.936 224 0 96 151.296 80.32 248.512 144.32 45.44 29.92 74.816 72.864 88.096 128.896A64 64 0 0 1 922.4 960H100.16a64 64 0 0 1-62.24-78.912c13.44-55.968 42.688-98.88 87.84-128.768 96.64-64 250.464-48.32 250.464-144.32 0-64-89.888-96-88.224-224V288c-1.664-128 78.496-224 224-224z m0 64c-100.992 0-158.208 57.408-160 151.456v105.376c-0.512 40.128 9.184 65.92 32.544 99.392 3.2 4.576 16.64 23.04 15.968 22.112l-0.416-0.576c7.136 9.92 12.224 17.376 16.96 25.312 14.912 24.832 23.168 49.184 23.168 76.928 0 88.704-50.144 121.6-161.6 153.536l-23.904 6.784c-8.96 2.56-16.192 4.704-23.04 6.848-31.232 9.728-53.312 19.072-70.592 30.528-31.392 20.8-51.232 49.856-60.928 90.304h822.24c-9.6-40.384-29.44-69.44-61.024-90.24-17.024-11.2-38.528-20.448-68.448-29.92-7.104-2.24-14.624-4.48-23.968-7.2-4.544-1.312-21.248-6.08-24.896-7.168-110.144-31.808-160-64.992-160-153.472 0-27.52 8-51.744 22.592-76.48 3.776-6.432 7.776-12.544 12.864-19.872l4.032-5.76-0.512 0.704 0.256-0.384c2.464-3.392 13.216-18.432 16-22.464C662.144 450.4 672 424.224 672 384V288c0-99.36-57.696-160-160-160z" /></svg>
            </span>
            <span class="zhh_tabText">未登录</span>
        </div>
    </nav>

    <script>
        // 点击页签切换红色选中态（发布按钮除外）
        function zhh_initTabbar() {
            var zhh_tabs = document.querySelector(".zhh_tabbar").children;
            for (var zhh_i = 0; zhh_i < zhh_tabs.length; zhh_i++) {
                if (zhh_tabs[zhh_i].className.indexOf("zhh_tabPublish") !== -1) { continue; }
                zhh_tabs[zhh_i].onclick = function () {
                    var zhh_list = document.querySelectorAll(".zhh_tab");
                    for (var zhh_j = 0; zhh_j < zhh_list.length; zhh_j++) {
                        zhh_list[zhh_j].classList.remove("zhh_on");
                    }
                    this.classList.add("zhh_on");
                };
            }
        }
        zhh_initTabbar();
    </script>
</body>
</html>
