<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻专题板块</title>
    <style>
        /* ========== 全局 CSS ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #333;
        }

        /* ========== 模块 CSS（类名均含姓名缩写 zhh） ========== */
        /* ===== 新闻专题面板 ===== */
        .zhh_panel {
            width: 270px;
            background: #fff;
            border-radius: 4px;
            padding: 12px 14px 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
        }

        /* 标题行 */
        .zhh_head {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        /* 头条图卡 */
        .zhh_topcard {
            display: block;
            position: relative;
            height: 128px;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            background: #222;
        }
        .zhh_topcard .zhh_bg {
            position: absolute;
            inset: 0;
            background: url("img/zhh_news_topic.png") center 30% / cover no-repeat;
            transition: transform .4s;
        }
        .zhh_topcard:hover .zhh_bg { transform: scale(1.04); }
        /* 底部黑色信息条 */
        .zhh_topcard .zhh_strip {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 34px;
            background: rgba(15, 15, 15, .82);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 6px;
        }
        .zhh_hot {
            flex-shrink: 0;
            background: #e8402f;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            line-height: 1;
            padding: 4px 6px 5px;
            border-radius: 2px;
            font-style: italic;
        }
        .zhh_toptitle {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .zhh_topcard:hover .zhh_toptitle { text-decoration: underline; }

        /* 列表 */
        .zhh_list { list-style: none; padding: 4px 0 2px; }
        .zhh_list li { padding: 9px 0; border-bottom: 1px solid #f2f2f2; }
        .zhh_list li:last-child { border-bottom: none; }
        .zhh_list a {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #333;
            text-decoration: none;
            line-height: 1.5;
        }
        .zhh_list a .zhh_sq {
            width: 5px;
            height: 5px;
            background: #e8402f;
            flex-shrink: 0;
        }
        .zhh_list a:hover { color: #e8402f; }
    </style>
</head>
<body>
    <!-- 姓名：张淮皓，建立时间：2026-11-02，使用的大模型：GLM-5.3-Flash，功能名称：新闻专题板块 -->
    <div class="zhh_panel">
        <div class="zhh_head">新闻专题</div>

        <a class="zhh_topcard" href="javascript:;">
            <span class="zhh_bg"></span>
            <span class="zhh_strip">
                <span class="zhh_hot">HOT</span>
                <span class="zhh_toptitle">美伊持续对峙 僵局难解</span>
            </span>
        </a>

        <ul class="zhh_list">
            <li>
                <a href="javascript:;"><span class="zhh_sq"></span>西班牙高铁列车追尾造成重大伤亡</a>
            </li>
            <li>
                <a href="javascript:;"><span class="zhh_sq"></span>姆巴佩发表涉华不当言论 本人道歉</a>
            </li>
            <li>
                <a href="javascript:;"><span class="zhh_sq"></span>美俄乌会谈将重启</a>
            </li>
        </ul> 
    </div>
</body>
</html>
