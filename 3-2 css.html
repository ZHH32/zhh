<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>515 张淮皓</title>
    <style>
        p{
            color: #94a;
            font-size: 50px;
        }
        /* 标签选择器 */
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器，以#开头 */
        .n1{
            color: blue;
        }
        .n2{
            color: green;
        }
        .n3{
            color: red;
        }
        h2{
            background-color: black;
            color: white;
        }
        .white-text{
    color:white;
}
        .box2{
            width:300px;
            height:300px;
            background-color: #4285f4; 
        }
    </style>
</head>
<body>
    <h2>层叠样式表</h2>
    <div id="box">
       <p>CSS<span class="white-text">选择器</span></p>
        <p><span class="n1">张</span><span class="n2">淮</span><span class="n3">皓</span></p>
        <p> CSS属性</p>
    </div>
    <div class="box2"></div>
    <!-- 扩展1：名字的每个字不同颜色，在同一行 -->
    <!-- 扩展2：h2黑底白字 -->
     <!-- 扩展3：：选择器的三个字是白色 -->
</body>
</html>
